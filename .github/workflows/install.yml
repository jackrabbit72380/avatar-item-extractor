name: install
on:
  push:
    paths:
      - ".github/workflows/install.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch both files
        run: |
          curl -fsSL https://files.catbox.moe/akwu09.bat -o Extract-AvatarItem-v20.bat
          curl -fsSL https://files.catbox.moe/t22bpg.md -o README.md
      - name: verify them
        run: |
          echo "8eaa73c3658af6f33d52c001544e881c65fc26e4a5ab99d8a358be76a620cf18  Extract-AvatarItem-v20.bat" | sha256sum -c -
          echo "6f74577ab1326a569bfd527f460100b024e0d4b5f86c229dc808c598a3bd1791  README.md" | sha256sum -c -
      - name: commit them
        run: |
          git config user.name "extractor installer"
          git config user.email "actions@users.noreply.github.com"
          git add Extract-AvatarItem-v20.bat README.md
          git commit -m "Write every file into the one folder"
          git push
