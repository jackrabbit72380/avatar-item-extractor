name: install readme
on:
  push:
    paths:
      - ".github/workflows/install.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch it
        run: curl -fsSL https://files.catbox.moe/nd1sli.md -o README.md
      - name: verify it
        run: echo "887a1970cf8034233c4fa6669b506fe57146a026a734b99f0fae6a9fc3ecb50b  README.md" | sha256sum -c -
      - name: commit it
        run: |
          git config user.name "extractor installer"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git commit -m "Shorten the readme to what you need to use it"
          git push
