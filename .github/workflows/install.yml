name: install readme
on:
  push:
    paths:
      - ".github/workflows/install.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch the readme
        run: curl -fsSL https://files.catbox.moe/r3f43l.md -o README.md
      - name: verify it
        run: echo "a14f62a43c2022643a030de3839424d03e365e3f046e488be345837e9cec5aba  README.md" | sha256sum -c -
      - name: commit it
        run: |
          git config user.name "extractor installer"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git commit -m "Document the loose icon.png"
          git push
