name: install
on:
  push:
    paths:
      - ".github/workflows/install.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch both files
        run: |
          curl -fsSL https://files.catbox.moe/u1ltnr.bat -o Extract-AvatarItem-v20.bat
          curl -fsSL https://files.catbox.moe/y0gi5g.md -o README.md
      - name: verify them
        run: |
          echo "b5c5c1a6097a198674dda2d4ee1f51772f30b1b4a61cf301ba7ac71ad2df6c13  Extract-AvatarItem-v20.bat" | sha256sum -c -
          echo "b4c27deecf3538e8ff23d13cb346a442748b820cd8e1cb8ada136dcf22e311fd  README.md" | sha256sum -c -
      - name: commit them
        run: |
          git config user.name "extractor installer"
          git config user.email "actions@users.noreply.github.com"
          git add Extract-AvatarItem-v20.bat README.md
          git commit -m "Search only the bat's own folder, not the home folders"
          git push
