name: install readme
on:
  push:
    paths:
      - ".github/workflows/install.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch the readme
        run: curl -fsSL https://files.catbox.moe/kz7ka7.md -o README.md
      - name: verify it
        run: echo "002fef61841dc32afe171173bff6ae18ee0da2bde6b0be2f264c225094cecd24  README.md" | sha256sum -c -
      - name: commit it
        run: |
          git config user.name "extractor installer"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git commit -m "Document bare model blocks and one file per model"
          git push
